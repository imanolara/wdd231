<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 128 128"
     role="img"
     aria-labelledby="logo-title">
  <title id="logo-title">Imanol Aranda monogram</title>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173f5f"/>
      <stop offset="100%" stop-color="#071e33"/>
    </linearGradient>
  </defs>

  <rect
    x="4"
    y="4"
    width="120"
    height="120"
    rx="28"
    fill="url(#background)"/>

  <rect
    x="10"
    y="10"
    width="108"
    height="108"
    rx="23"
    fill="none"
    stroke="#e9b949"
    stroke-width="3"/>

  <!-- Letter I -->
  <path
    d="M28 36 H52 M40 36 V92 M28 92 H52"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"/>

  <!-- Letter A -->
  <path
    d="M59 92 L82 35 L105 92 M68 72 H96"
    fill="none"
    stroke="#e9b949"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <circle cx="108" cy="21" r="5" fill="#e9b949"/>
</svg>